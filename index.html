<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alliance Chat</title>

<style>
body {
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 50px;
}

.box {
    background: #1f2937;
    width: 300px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
}

input, button {
    width: 90%;
    padding: 10px;
    margin: 8px;
    border-radius: 8px;
    border: none;
}

button {
    background: #2563eb;
    color: white;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="box">

<h1>Alliance Chat</h1>

<p>Закрытая связь</p>

<input id="username" placeholder="Имя">

<input id="password" placeholder="Пароль" type="password">

<button onclick="login()">Войти</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://pxjfvyzwdiipjqtdbqyn.supabase.co/rest/v1/";
const supabaseKey = "sb_publishable_qql33m_Ojxnxl1lXwROQKQ_qRz13Mz9";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabase
        .from("users")
        .select("*")
        .eq("username", username)
        .eq("password", password);

    if (data.length > 0) {
        alert("Вход выполнен");
    } else {
        const { error } = await supabase
            .from("users")
            .insert([
                {
                    username: username,
                    password: password
                }
            ]);

        alert("Новый пользователь создан");
    }
}
</script>

</body>
</html>
